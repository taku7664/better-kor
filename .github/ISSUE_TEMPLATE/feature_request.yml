name: 기능 제안
description: 있었으면 하는 것, 지금 불편한 것
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: 먼저 확인해 주세요
      options:
        - label: 이미 올라온 제안이 있는지 검색했습니다
          required: true

  - type: textarea
    attributes:
      label: 어떤 문제를 풀고 싶나요
      description: 기능부터 적지 말고 지금 무엇이 불편한지부터 적어 주세요.
      placeholder: ~를 하려면 매번 ~를 해야 해서 번거롭습니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 어떻게 해결하면 좋을까요
      description: 떠오르는 방법이 있으면 적어 주세요. 없으면 비워 두셔도 됩니다.
    validations:
      required: false

  - type: textarea
    attributes:
      label: 다른 방법은 없나요
      description: 지금 우회하는 방법이 있는지, 다른 해결책을 생각해 봤는지.
    validations:
      required: false

  - type: textarea
    attributes:
      label: 그 밖에
      description: 참고할 만한 사례나 화면 등.
    validations:
      required: false
